<style>
:root{
  --rose:#C8446B; --rose-deep:#A32E52; --rose-soft:#F0BFCD;
  --gold:#C9A46A; --noir:#1A0E14; --cream:#FBF3EA;
  --font-d:'Playfair Display',Georgia,serif;
  --font-b:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100dvh;display:grid;place-items:center;text-align:center;
  padding:40px 24px;background:var(--noir);color:#F6EAEF;
  font-family:var(--font-b);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(44vmax 44vmax at 18% 12%,rgba(200,68,107,.30),transparent 62%),
    radial-gradient(40vmax 40vmax at 84% 88%,rgba(201,164,106,.22),transparent 62%);
  animation:drift 22s var(--ease) infinite alternate;
}
@keyframes drift{to{transform:translate3d(3vw,-3vh,0) scale(1.12)}}
main{position:relative;z-index:1;max-width:620px}
.brand{display:block;font-family:var(--font-d);font-size:2rem;color:var(--rose-soft);margin-bottom:8px}
.brand .leaf{display:inline-block;transform:translate(-2px,-9px) rotate(6deg) scale(.42);color:var(--gold)}
.tag{font-size:.56rem;letter-spacing:.34em;text-transform:uppercase;color:rgba(246,234,239,.5)}
.rule{height:1px;width:110px;margin:30px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
h1{font-family:var(--font-d);font-weight:500;font-size:clamp(2.6rem,9vw,4.6rem);line-height:1.02;margin:0 0 6px;letter-spacing:-.01em}
h1 em{font-style:italic;color:var(--rose-soft)}
p{color:rgba(246,234,239,.7);max-width:46ch;margin:0 auto 1em}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:34px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:52px;padding:0 28px;border:1px solid transparent;border-radius:10px;
  font-size:.78rem;font-weight:500;letter-spacing:.19em;text-transform:uppercase;
  cursor:pointer;background:var(--rose);color:#fff;text-decoration:none;
  transition:transform .22s var(--ease),background .22s,color .22s,border-color .22s;
}
.btn:hover{transform:translateY(-2px);background:var(--rose-deep)}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.btn.ghost:hover{background:#fff;color:var(--noir);border-color:#fff}
.links{margin-top:40px;display:flex;gap:8px 26px;flex-wrap:wrap;justify-content:center}
.links a{
  color:rgba(246,234,239,.62);text-decoration:none;font-size:.72rem;
  letter-spacing:.16em;text-transform:uppercase;padding-bottom:3px;
  border-bottom:1px solid transparent;transition:.25s var(--ease);
}
.links a:hover{color:#fff;border-bottom-color:var(--rose)}
:focus-visible{outline:2px solid var(--rose-soft);outline-offset:3px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  body::before{animation:none}
  .btn:hover{transform:none}
}
</style>
</head>
